name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Toolkit fixture guard (NFR9)
        run: ./scripts/check-toolkit-fixture.sh

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta

      - name: Write env files from the local stack
        run: |
          eval "$(pnpm exec supabase status -o env | sed 's/^/export SB_/')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SB_API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SB_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SB_SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$SB_DB_URL"
            echo "BOOTSTRAP_ADMIN_EMAIL=admin@fluently.test"
            echo "MAILPIT_URL=$SB_MAILPIT_URL"
            echo "AI_MODE=fake"
          } > .env.local
          cp .env.local .env.test

      - name: Reset database from migrations + seed
        run: pnpm exec supabase db reset

      - run: pnpm test:int

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e -- --trace off

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            e2e/screenshots
          retention-days: 7
